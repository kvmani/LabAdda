# Local proxy used by scripts/proxy-stack.sh for root + prefixed instances (T03). HTTP only, loopback.
worker_processes 1;
error_log __RUN__/nginx-error.log;
pid __RUN__/nginx.pid;
events { worker_connections 256; }
http {
    access_log __RUN__/nginx-access.log;
    types { text/html html; application/javascript js; text/css css; }
    client_max_body_size 25m;
    client_body_temp_path __RUN__/tmp; proxy_temp_path __RUN__/tmp; fastcgi_temp_path __RUN__/tmp;
    uwsgi_temp_path __RUN__/tmp; scgi_temp_path __RUN__/tmp;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 127.0.0.1:__PORT__;
        location /labadd-staging/assets/ { alias __DIST__/assets/; }
        location /labadd-staging/ws/ {
            proxy_pass http://127.0.0.1:8002; proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $http_host;
        }
        location /labadd-staging { proxy_pass http://127.0.0.1:8002; proxy_set_header Host $http_host; }
        location /assets/ { alias __DIST__/assets/; }
        location /ws/ {
            proxy_pass http://127.0.0.1:8001; proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $http_host;
        }
        location / { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $http_host; }
    }
}
