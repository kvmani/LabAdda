[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labadd"
version = "0.1.0"
description = "LabAdd intranet collaboration workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "argon2-cffi==23.1.0",
  "python-multipart==0.0.20",
  "pillow==11.0.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1"]

[project.scripts]
labadd = "labadd.cli:main"

[tool.setuptools.packages.find]
include = ["labadd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
