[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labadda"
version = "0.1.0"
description = "LabAdda intranet collaboration workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "argon2-cffi==23.1.0",
  "python-multipart==0.0.20",
  "pillow==11.0.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1", "ruff==0.17.4"]

[project.scripts]
labadda = "labadda.cli:main"

[tool.setuptools.packages.find]
include = ["labadda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "S", "BLE", "N", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "PLR0915"]
"migrations/*" = ["N999"]
