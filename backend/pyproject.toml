[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labadda"
version = "0.1.0"
description = "LabAdda intranet collaboration workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "argon2-cffi==23.1.0",
  "python-multipart==0.0.20",
  "pillow==11.0.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1", "ruff==0.17.4"]

[project.scripts]
labadda = "labadda.cli:main"

[tool.setuptools.packages.find]
include = ["labadda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "S", "BLE", "N", "PL", "RUF"]
ignore = [
  "PLR0913", "PLR2004", "S101",
  # Error classes are named for the HTTP outcome (NotFound, Forbidden) and are public API.
  "N818",
  # Function size and argument-count rules are enabled by package Q3, which restructures functions.
  "PLR0911", "PLR0912", "PLR0915", "PLR0917",
]

[tool.ruff.lint.isort]
# Stated explicitly so import order is the same whether Ruff runs from the root or backend/.
known-first-party = ["labadda"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters through these calls in argument defaults.
extend-immutable-calls = [
  "fastapi.Body", "fastapi.Depends", "fastapi.File", "fastapi.Form",
  "fastapi.Header", "fastapi.Path", "fastapi.Query", "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Tests import inside test functions on purpose, to scope monkeypatching and optional modules.
# Tests import inside test functions on purpose, to scope monkeypatching and optional modules,
# and use non-ASCII text on purpose to prove Unicode round trips.
"**/tests/*.py" = ["S105", "S106", "S108", "PLC0415", "RUF001"]
# Operator tools run fixed argument lists without a shell; git is resolved from the build host's PATH.
"**/scripts/*.py" = ["S603", "S607"]
"**/labadda/recovery.py" = ["S603"]
# Random coordinates for synthetic drawing load and fixture art, not for security.
"**/scripts/soak.py" = ["S311"]
"**/scripts/rehearsal.py" = ["S311"]
"**/scripts/generate-research-art.py" = ["S311"]
# Pushed migrations are frozen (AGENTS.md), so their long SQL strings stay as written.
"**/migrations/**" = ["N999", "E501"]
# Each subcommand imports only what it runs, so `labadda --help` and small commands stay fast.
# Each subcommand maps any failure to a safe operator message and a non-zero exit code.
"**/labadda/cli.py" = ["PLC0415", "BLE001"]
