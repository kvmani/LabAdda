server {
    listen 80 default_server;
    server_name _;

    # =========================
    # CHEMISTRY
    # =========================

    location = /chemistry {
        return 301 /chemistry/;
    }

    location ^~ /chemistry/api/ {
        rewrite ^/chemistry/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /chemistry;
    }

    location ^~ /chemistry/health/ {
        rewrite ^/chemistry/health/(.*)$ /health/$1 break;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /chemistry;
    }

    location = /chemistry/docs {
        rewrite ^/chemistry/docs$ /docs break;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /chemistry;
    }

    location = /chemistry/openapi.json {
        rewrite ^/chemistry/openapi.json$ /openapi.json break;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /chemistry;
    }

    location = /chemistry/redoc {
        rewrite ^/chemistry/redoc$ /redoc break;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /chemistry;
    }

    location ^~ /chemistry/ {
        root /var/www/apex_pm;
        index index.html;
        try_files $uri $uri/ /chemistry/index.html;
    }

    # =========================
    # PRODUCTION
    # =========================

    location = /production {
        return 301 /production/;
    }

    location ^~ /production/api/ {
        rewrite ^/production/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /production;
    }

    location ^~ /production/health/ {
        rewrite ^/production/health/(.*)$ /health/$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /production;
    }

    location = /production/docs {
        rewrite ^/production/docs$ /docs break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /production;
    }

    location = /production/openapi.json {
        rewrite ^/production/openapi.json$ /openapi.json break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /production;
    }

    location = /production/redoc {
        rewrite ^/production/redoc$ /redoc break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /production;
    }

    location ^~ /production/ {
        root /var/www/apex_pm;
        index index.html;
        try_files $uri $uri/ /production/index.html;
    }

    # =========================
    # STAGING
    # =========================

    location = /staging {
        return 301 /staging/;
    }

    location ^~ /staging/api/ {
        rewrite ^/staging/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /staging;
    }

    location ^~ /staging/health/ {
        rewrite ^/staging/health/(.*)$ /health/$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /staging;
    }

    location = /staging/docs {
        rewrite ^/staging/docs$ /docs break;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /staging;
    }

    location = /staging/openapi.json {
        rewrite ^/staging/openapi.json$ /openapi.json break;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /staging;
    }

    location = /staging/redoc {
        rewrite ^/staging/redoc$ /redoc break;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /staging;
    }

    location ^~ /staging/ {
        root /var/www/apex_pm;
        index index.html;
        try_files $uri $uri/ /staging/index.html;
    }
}
