name: ci
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: labadda
          POSTGRES_PASSWORD: labadda-dev
          POSTGRES_DB: labadda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labadda" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LABADDA_RECOVERY_TESTS: "1"
      LABADDA_TEST_DATABASE_URL: postgresql+psycopg://labadda:labadda-dev@localhost:5432/labadda_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install PostgreSQL recovery clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements.lock
          .venv/bin/pip install --no-deps -e backend
          cd frontend && npm ci
      - name: Verify
        run: scripts/verify.sh

  collaboration-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: labadda
          POSTGRES_PASSWORD: labadda-dev
          POSTGRES_DB: labadda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labadda" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install synthetic stack dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx postgresql-client-16
          sudo systemctl stop nginx
          PGPASSWORD=labadda-dev createdb -h 127.0.0.1 -U labadda labadda_e2e_root
          PGPASSWORD=labadda-dev createdb -h 127.0.0.1 -U labadda labadda_e2e_prefix
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements.lock
          .venv/bin/pip install --no-deps -e backend
          npm --prefix frontend ci
          npm --prefix frontend run build
          npm --prefix e2e ci
          cd e2e
          npx playwright install --with-deps chromium
          node --input-type=module -e 'import {chromium} from "playwright"; console.log("LABADDA_CHROMIUM=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Run isolated full multi-user regression system
        run: .venv/bin/python scripts/simulate.py --profile full --out var/simulation-evidence --apply-disposable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-collaboration-evidence
          path: var/simulation-evidence
          retention-days: 7
          if-no-files-found: warn
