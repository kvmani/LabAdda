name: ci
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: labadd
          POSTGRES_PASSWORD: labadd-dev
          POSTGRES_DB: labadd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labadd" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LABADD_TEST_DATABASE_URL: postgresql+psycopg://labadd:labadd-dev@localhost:5432/labadd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements.lock
          .venv/bin/pip install --no-deps -e backend
          cd frontend && npm ci
      - name: Verify
        run: scripts/verify.sh
